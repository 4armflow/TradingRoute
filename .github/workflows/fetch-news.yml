name: Fetch ryt9 headlines

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch headlines
        run: node scripts/fetch-ryt9.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/live-news.json && [ -z "$(git status --porcelain data/live-news.json)" ]; then
            echo "No new headlines"; exit 0
          fi
          git config user.name "TradingRoute Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-news.json
          git commit -m "Update live headlines"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
