name: Build promotions

on:
  push:
    branches: [main]
    paths: ["promos/**"]
  schedule:
    - cron: "5 17 * * *"   # 00:05 เวลาไทย ทุกวัน: ซ่อนโปรที่หมดเขต
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-promos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install image tool
        run: npm install --no-save --no-package-lock sharp@0.33.5
      - name: Build promos
        run: node scripts/build-promos.mjs
      - name: Commit if changed
        run: |
          git add -A data/promos.json data/promo-img
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "TradingRoute Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update promotions"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
